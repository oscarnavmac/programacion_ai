[project]
name = "numpy-readings-report"
version = "0.1.0"
description = "NumPy arrays and measurement data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2,<3"]

[dependency-groups]
dev = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbconvert>=7,<8", "pytest>=8,<10", "ruff>=0.16,<0.17"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
